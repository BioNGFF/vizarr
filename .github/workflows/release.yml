name: Release

# `main` only moves by merging the release pull request, so what lands here is the same
# merge commit CI already passed on. The verification below is the gate before anything
# is tagged and published, which is worth paying for twice; what is not worth paying for
# is a third copy after the release exists, which is why the deploy no longer has one.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # semantic-release pushes the version bump back, which the default token is
          # not allowed to do past branch protection.
          token: ${{ secrets.GH_PAT }}

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Create release tarball
        run: tar -czpf dist.tar.gz sites/app/dist LICENSE

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: pnpm exec semantic-release
