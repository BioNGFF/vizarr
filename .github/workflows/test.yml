name: Build & Test

on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
