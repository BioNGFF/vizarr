name: Build docs

# Builds, does not publish. Publishing happens on release, which is too late to
# discover that typedoc cannot resolve a type.
#
# A path filter is safe here in a way it was not for the deploy: missing a run only
# means this check did not happen, not that the published site silently drifts. It
# has to cover the setup action too, since the build now depends on it.
on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "docs/**"
      - "viewer/src/**"
      - "roi-selector/src/**"
      - "anndata-zarr/src/**"
      - "typedoc.json"
      - "*/typedoc.json"
      - ".github/workflows/build-docs.yml"
      - ".github/actions/setup/**"

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # typedoc.json sets treatWarningsAsErrors, so a documented type that links to
      # an undocumented one fails here rather than reaching a reader as a dead end.
      - name: Build docs
        run: pnpm build:docs
