name: Deploy docs

# The release, not a push that might have touched the right files. Published API
# documentation should describe the published package, and a path-filtered push has
# no way to notice it was missed -- the site sat six weeks out of date because one
# push produced no workflow runs at all. See #146.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to document. Defaults to the tip of main."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # An empty ref is the default branch, which is what an unqualified manual
          # run should get.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Build docs
        run: pnpm build:docs

      # The deploy below deletes whatever is in the bucket and not in this build, so
      # a partial build would publish itself by emptying the site. One non-empty
      # index.html was not enough to rule that out.
      - name: Verify build output
        run: |
          set -euo pipefail
          test -s docs/build/index.html
          files=$(find docs/build -type f | wc -l)
          bytes=$(du -sb docs/build | cut -f1)
          echo "built $files files, $bytes bytes"
          if [ "$files" -lt 50 ] || [ "$bytes" -lt 500000 ]; then
            echo "::error::The build looks truncated ($files files, $bytes bytes). Refusing to deploy over the live site."
            exit 1
          fi

      # This now runs at a tag ref rather than a branch, and the token it exchanges
      # carries that ref. The Pages deploy failed exactly here -- its environment
      # allowed `main` and `dev` and no tags, so every release deploy was rejected
      # after a clean build (#139). The equivalent gate for this one lives in Google:
      # the workload identity provider's attribute condition, and the principalSet on
      # the service account. If either keys on `attribute.ref` rather than
      # `attribute.repository`, release deploys will fail to authenticate. This
      # workflow has only ever run from branches, so that path is untested.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy viewer docs
        run: |
          gcloud storage rsync docs/build gs://${{ secrets.GCS_BUCKET }} \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="no-cache"
