name: Deploy app

# The release, not the push that caused it. semantic-release writes the version bump
# as a commit of its own, so the pushed commit carries the previous version and would
# deploy a build that misreports itself. The tag names the bumped commit, so checking
# that out deploys what the release actually is. See #139.
#
# Deploying from a tag needs the `github-pages` environment to allow one: it is set to
# "selected branches and tags", and until a `v*` tag rule was added it held branch rules
# only, so every release deploy was rejected after a successful build.
on:
  release:
    types: [published]
  # A deploy is otherwise only reachable by cutting a release, which is a poor way to
  # recover from a bad one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy. Defaults to the tip of main."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # An empty ref is the default branch, which is what an unqualified manual run
          # should get.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # No typecheck, lint or test here. This runs after the release has been cut, so
      # failing cannot prevent anything -- it only blocks the deploy of code that CI
      # already passed twice. The one thing this tree has that main's did not is the
      # version bump, and a build that succeeds is proof enough that it did no harm.
      - name: Build
        run: pnpm build

      - name: Add .nojekyll
        run: touch sites/app/dist/.nojekyll

      - name: Upload build output for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
