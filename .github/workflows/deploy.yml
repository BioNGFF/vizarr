name: Deploy

# The release, not the push that caused it. semantic-release writes the version bump
# as a commit of its own, so the pushed commit carries the previous version and would
# deploy a build that misreports itself. The tag names the bumped commit, so checking
# that out deploys what the release actually is. See #139.
on:
  release:
    types: [published]
  # A deploy is otherwise only reachable by cutting a release, which is a poor way to
  # recover from a bad one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy. Defaults to the tip of main."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # An empty ref is the default branch, which is what an unqualified manual run
          # should get.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build main branch
        run: pnpm build

      - name: Add .nojekyll
        run: touch sites/app/dist/.nojekyll

      - name: Upload build output for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
