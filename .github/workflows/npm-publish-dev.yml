name: Publish Dev

# Publishes a pre-release (dev) version of the package to npmjs.org
# whenever changes are pushed to the "dev" branch.
on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5
          run_install: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Update prerelease version
        id: pre-release-version
        uses: adobe/update-prerelease-npm-version@v1.2.0
        with:
          pre-release-tag: "dev"

      - name: Sync package versions across workspace
        run: pnpm -r exec npm version ${{ steps.pre-release-version.outputs.pre-release-version }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install

      - name: Build Viewer Package
        run: pnpm build:viewer

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (dev tag)
        run: pnpm publish viewer --tag dev --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
